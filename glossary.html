<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glossary — Py30</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23E0357A%22/><text x=%2250%22 y=%2266%22 font-size=%2248%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22monospace%22>py</text></svg>">
<link rel="stylesheet" href="assets/vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="assets/css/style.css">
<script src="js/app.js"></script>
</head>
<body>
<main class="wrap" style="padding-top:26px">
<h1>Glossary</h1><p>Every important word from the course, with a short Arabic explanation. It grows as you move through the days.</p>
<input class="search" id="q" type="search" placeholder="Search a word in English or Arabic…" aria-label="Search the glossary">
<div style="overflow-x:auto"><table class="gl" id="t"></table></div>
</main>
<script src="js/glossary.js"></script>
<script>Py30.renderTopbar("glossary");
(function(){ const esc = Py30.esc, t = document.getElementById("t"), q = document.getElementById("q");
  function draw(){ const v = q.value.trim().toLowerCase();
    const rows = GLOSSARY.filter(r => !v || r.join(" ").toLowerCase().includes(v));
    t.innerHTML = `<tr><th>Term</th><th>Meaning</th><th class="ar">بالعربي</th><th>Day</th></tr>` + rows.map(r => `<tr><td><code>${esc(r[0])}</code></td><td>${esc(r[1])}</td><td class="ar">${esc(r[2])}</td><td><a href="lesson.html?day=${r[3]}">${r[3]}</a></td></tr>`).join("") || `<tr><td colspan="4">No match.</td></tr>`; }
  q.oninput = draw; draw(); })(); Py30.renderFooter();</script></body></html>
