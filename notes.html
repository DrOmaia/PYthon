<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My notes — Py30</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23E0357A%22/><text x=%2250%22 y=%2266%22 font-size=%2248%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22monospace%22>py</text></svg>">
<link rel="stylesheet" href="assets/vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="assets/css/style.css">
<script src="js/app.js"></script>
</head>
<body>
<main class="wrap narrow" style="padding-top:26px">
<h1>My notes</h1><p class="muted">Everything you wrote in the "My notes" box of each day.</p>
<div id="list"></div>
<div class="no-print" style="margin:20px 0"><button class="btn btn-soft" onclick="print()">Print my notes</button></div>
</main>
<script src="js/curriculum.js"></script>
<script>Py30.renderTopbar("notes"); Py30.requireProfile();
(function(){ const N = Py30.state.notes || {}, esc = Py30.esc;
  const ks = Object.keys(N).filter(k => N[k] && N[k].trim()).sort((a,b)=>a-b);
  document.getElementById("list").innerHTML = ks.length ? ks.map(k => { const d = CURRICULUM.days.find(x=>x.d==k);
    return `<div class="panel" style="margin:14px 0"><h3><a href="lesson.html?day=${k}#notes">Day ${k}: ${esc(d.title)}</a></h3><div style="white-space:pre-wrap">${esc(N[k])}</div></div>`; }).join("")
    : `<div class="panel"><p>No notes yet. At the end of every lesson there is a "My notes" box — write the day's main ideas in your own words there.</p><a class="btn btn-primary" href="index.html">Go to your journey</a></div>`;
})(); Py30.renderFooter();</script></body></html>
