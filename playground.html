<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground — Py30</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23E0357A%22/><text x=%2250%22 y=%2266%22 font-size=%2248%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22monospace%22>py</text></svg>">
<link rel="stylesheet" href="assets/vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="assets/css/style.css">
<script src="js/app.js"></script>
</head>
<body>
<main class="wrap narrow" style="padding-top:26px">
<h1>Playground</h1>
<p>Try any idea here. Your code is saved automatically. Use the <b>Input</b> box for programs that call <code>input()</code>, and <b>Visualize</b> to watch your code run line by line.</p>
<div class="callout hint-ar"><div class="ar" id="pgAr"></div></div>
<div id="pg"></div>
<p class="muted" style="font-size:.9rem">Available: the whole Python standard library (<code>math</code>, <code>random</code>, <code>datetime</code>, …) plus <code>numpy</code> and <code>scikit-learn</code>.</p>
</main>
<script>Py30.renderTopbar("playground"); Py30.requireProfile();</script>
<script src="assets/vendor/codemirror/codemirror.js"></script>
<script src="assets/vendor/codemirror/python.js"></script>
<script src="assets/vendor/codemirror/matchbrackets.js"></script>
<script src="assets/vendor/codemirror/closebrackets.js"></script>
<script src="js/runner.js"></script>
<script src="js/errors.js"></script>
<script src="js/components.js"></script>
<script>
document.getElementById("pgAr").textContent = Py30.T("هنا مساحتك الحرة يا {{name}}. جرّب{{g:|ي}} وغلّط{{g:|ي}} وتعلّم{{g:|ي}}، لن يحدث شيء سيئ!");
document.getElementById("pg").appendChild(PyUI.CodeBox({ id: "playground", persist: true, showStdin: true, title: "playground.py",
  code: '# Welcome to your playground, {{name}}!\nname = input("What is your name? ")\nprint(f"Hello, {name}! Python is ready.")\n\nfor i in range(1, 4):\n    print(i, "*" * i)\n', stdin: "{{name}}" }));
PyRunner.warmup().catch(()=>{});
Py30.renderFooter();
</script></body></html>
